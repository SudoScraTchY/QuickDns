name: Build & Release QuickDNS

# Design
# ------
# - test:          run the test suite on Windows AND Linux (store + TUI must work on both).
# - build:         one job per supported RID in two flavors:
#                    full (default): self-contained, trimmed, ReadyToRun, single-file executables.
#                    fd:             framework-dependent, tiny download, needs the .NET 11 runtime.
#                  Every artifact gets a SHA256 checksum file and a smoke test
#                  (--version / --diagnostics / --setup / --uninstall).
# - aot:           experimental NativeAOT build for Windows x64; allowed to fail without
#                  blocking releases. Smallest and fastest, validated by the same smoke test.
# - release:       a. push to main          -> refresh the rolling "latest" prerelease.
#                                          The body STARTS with a Markdown download table
#                                          (direct links + checksums) generated by a helper step.
#                  b. push of a v* tag     -> versioned GitHub Release; the same table sits on
#                                          top of the auto-generated notes.
#                  PRs and manual dispatch build + upload artifacts only — never release.
#
# Supported matrix today: Windows (x64/x86/ARM64) and Linux (x64/ARM64/ARM32/musl-x64/musl-arm64).
# macOS is intentionally absent: the adapter service has no macOS backend yet, so we do not
# ship binaries that would refuse to run. To add it later, extend the matrix with
# { os: macos-latest, rid: osx-arm64 } / { os: macos-latest, rid: osx-x64 } — one line each.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------- test ----
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run tests
        run: dotnet test QuickDNS.sln -c Release --nologo

  # Experimental NativeAOT build for Windows x64. Allowed to fail without
  # blocking releases; the artifact lets users try the fastest startup.
  aot:
    name: AOT win-x64 (experimental)
    needs: test
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Publish NativeAOT
        shell: pwsh
        run: >
          dotnet publish QuickDnsConsole/QuickDnsConsole.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishAot=true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/aot

      - name: Smoke test (read-only + CLI integration round trip)
        shell: pwsh
        run: |
          .\publish\aot\QuickDNSConsole.exe --version
          .\publish\aot\QuickDNSConsole.exe --diagnostics
          .\publish\aot\QuickDNSConsole.exe --setup
          # Exercise the INSTALLED copy: NativeAOT builds need e_sqlite3.dll next to the
          # exe, so a --setup that only copies the exe would break the preset store.
          & "$env:LOCALAPPDATA\Programs\QuickDNS\QuickDNS.exe" --diagnostics
          .\publish\aot\QuickDNSConsole.exe --uninstall

      - name: Route mode round trip (real proxy + resolution)
        shell: pwsh
        run: |
          .\publish\aot\QuickDNSConsole.exe --route-start
          Resolve-DnsName example.com -Server 127.0.0.2 -Type A | Out-String
          .\publish\aot\QuickDNSConsole.exe --route-stop

      - name: Package (zip + SHA256)
        shell: bash
        run: |
          cd publish/aot
          if [ -f QuickDNSConsole.exe ]; then mv QuickDNSConsole.exe QuickDNS.exe; fi
          7z a ../QuickDNS-win-x64-aot.zip .
          cd ..
          sha256sum QuickDNS-win-x64-aot.zip > QuickDNS-win-x64-aot.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDNS-win-x64-aot
          path: |
            publish/QuickDNS-win-x64-aot.zip
            publish/QuickDNS-win-x64-aot.zip.sha256
          if-no-files-found: error

  # --------------------------------------------------------------- build ----
  build:
    name: Build ${{ matrix.rid }} (${{ matrix.mode }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-contained single-file builds: run on a bare OS, no .NET needed.
          # smoke: only true where the produced binary can execute on the runner
          # (an x64/x86 runner cannot run arm64/arm/musl binaries — CI smoke would
          # fail on runnable-vs-not, not on the build itself).
          - { os: windows-latest, rid: win-x64,             artifact: QuickDNS-win-x64,             mode: full, smoke: true }
          - { os: windows-latest, rid: win-x86,             artifact: QuickDNS-win-x86,             mode: full, smoke: true }
          - { os: windows-latest, rid: win-arm64,           artifact: QuickDNS-win-arm64,           mode: full, smoke: false }
          - { os: ubuntu-latest,  rid: linux-x64,           artifact: QuickDNS-linux-x64,           mode: full, smoke: true }
          - { os: ubuntu-latest,  rid: linux-arm64,         artifact: QuickDNS-linux-arm64,         mode: full, smoke: false }
          - { os: ubuntu-latest,  rid: linux-arm,           artifact: QuickDNS-linux-arm,           mode: full, smoke: false }
          - { os: ubuntu-latest,  rid: linux-musl-x64,      artifact: QuickDNS-linux-musl-x64,      mode: full, smoke: false }
          - { os: ubuntu-latest,  rid: linux-musl-arm64,    artifact: QuickDNS-linux-musl-arm64,    mode: full, smoke: false }
          # Framework-dependent builds: tiny download for machines that already have the .NET 11 runtime.
          - { os: windows-latest, rid: win-x64,             artifact: QuickDNS-win-x64-fd,          mode: fd,   smoke: true }
          - { os: windows-latest, rid: win-arm64,           artifact: QuickDNS-win-arm64-fd,        mode: fd,   smoke: false }
          - { os: ubuntu-latest,  rid: linux-x64,           artifact: QuickDNS-linux-x64-fd,        mode: fd,   smoke: true }
          - { os: ubuntu-latest,  rid: linux-arm64,         artifact: QuickDNS-linux-arm64-fd,      mode: fd,   smoke: false }
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # .NET 11 is GA (2026-11-10); the SDK resolves to the latest 11.0.x.
          dotnet-version: 11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Tag builds (refs/tags/vX.Y.Z) stamp the tag version into the executable.
      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          ARGS=(
            -c Release
            -r "${{ matrix.rid }}"
            -p:DebugType=none -p:DebugSymbols=false
            -o "publish/${{ matrix.artifact }}"
          )
          if [[ "${{ matrix.mode }}" == "full" ]]; then
            ARGS+=(
              --self-contained true
              -p:PublishSingleFile=true
              -p:PublishReadyToRun=true
              -p:PublishTrimmed=true
              -p:IncludeNativeLibrariesForSelfExtract=true
            )
          else
            # Framework-dependent: small zip, requires the .NET 11 runtime on the machine.
            ARGS+=(
              --self-contained false
              -p:Trimming=false
              -p:PublishTrimmed=false
              -p:PublishReadyToRun=false
            )
          fi
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            ARGS+=("-p:Version=${{ steps.version.outputs.value }}")
          fi
          dotnet publish QuickDnsConsole/QuickDnsConsole.csproj "${ARGS[@]}"

      # Catches regressions early: the binary must boot, diagnose itself, and the
      # built-in CLI integration must install and uninstall cleanly on a fresh machine.
      # Only on RIDs the runner can actually execute (see the smoke matrix column).
      - name: Smoke test
        if: matrix.smoke == true
        shell: bash
        run: |
          EXE="publish/${{ matrix.artifact }}/QuickDNSConsole"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXE="publish/${{ matrix.artifact }}/QuickDNSConsole.exe"; fi
          "$EXE" --version
          "$EXE" --diagnostics
          "$EXE" --setup
          # Exercise the INSTALLED copy: catches missing companion runtime files
          # (native dlls / deps.json) that --setup must carry over.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            "$LOCALAPPDATA/Programs/QuickDNS/QuickDNS.exe" --diagnostics
          else
            "$HOME/.local/bin/quickdns" --diagnostics
          fi
          "$EXE" --uninstall

      - name: Route mode round trip (real proxy + resolution)
        shell: bash
        run: |
          EXE="publish/${{ matrix.artifact }}/QuickDNSConsole"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXE="publish/${{ matrix.artifact }}/QuickDNSConsole.exe"; fi
          # Route mode needs elevation: sudo on Linux runners (passwordless), admin is
          # default on Windows runners.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            "$EXE" --route-start
            powershell -NoProfile -Command "Resolve-DnsName example.com -Server 127.0.0.2 -Type A | Out-String"
            "$EXE" --route-stop
          else
            sudo "$EXE" --route-start
            if command -v dig >/dev/null 2>&1; then
              dig @127.0.0.2 example.com +time=3 +tries=1 +short
            else
              nslookup example.com 127.0.0.2
            fi
            sudo "$EXE" --route-stop
          fi

      - name: Package (zip + SHA256)
        shell: bash
        run: |
          cd "publish/${{ matrix.artifact }}"
          if [ -f QuickDNSConsole.exe ]; then mv QuickDNSConsole.exe QuickDNS.exe; fi
          if [ -f QuickDNSConsole ]; then mv QuickDNSConsole QuickDNS; fi
          7z a "../${{ matrix.artifact }}.zip" .
          cd ..
          sha256sum "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            publish/${{ matrix.artifact }}.zip
            publish/${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error

  # ------------------------------------------------------------- release ----
  release:
    name: Release
    needs: [ build, aot ]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Markdown table helper: renders the download table that sits ON TOP of the
      # release page, with a direct download link and a checksum link per asset.
      - name: Build download table
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          else
            BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest"
          fi

          row() { # platform build zip
            echo "| $1 | $2 | [${3}.zip](${BASE}/${3}.zip) | [.sha256](${BASE}/${3}.zip.sha256) |"
          }

          {
            echo "## Downloads"
            echo
            echo "| Platform | Build | Download | SHA256 |"
            echo "| --- | --- | --- | --- |"
            row "Windows x64" "self-contained" "QuickDNS-win-x64"
            row "Windows x86" "self-contained" "QuickDNS-win-x86"
            row "Windows ARM64" "self-contained" "QuickDNS-win-arm64"
            row "Linux x64 (glibc)" "self-contained" "QuickDNS-linux-x64"
            row "Linux ARM64 (glibc)" "self-contained" "QuickDNS-linux-arm64"
            row "Linux ARM32 (glibc)" "self-contained" "QuickDNS-linux-arm"
            row "Linux x64 (Alpine)" "self-contained" "QuickDNS-linux-musl-x64"
            row "Linux ARM64 (Alpine)" "self-contained" "QuickDNS-linux-musl-arm64"
            row "Windows x64" "framework-dependent" "QuickDNS-win-x64-fd"
            row "Windows ARM64" "framework-dependent" "QuickDNS-win-arm64-fd"
            row "Linux x64 (glibc)" "framework-dependent" "QuickDNS-linux-x64-fd"
            row "Linux ARM64 (glibc)" "framework-dependent" "QuickDNS-linux-arm64-fd"
            row "Windows x64" "NativeAOT (experimental)" "QuickDNS-win-x64-aot"
            echo
            echo "**self-contained** — single-file executable, no .NET install needed. **framework-dependent** — tiny download, needs the [.NET 11 runtime](https://dotnet.microsoft.com/download/dotnet/11.0). **NativeAOT** — experimental native build with the fastest startup."
            echo
            echo "After unzipping, run \`QuickDNS --setup\` once to make \`quickdns\` callable from any terminal window (\`QuickDNS --uninstall\` reverts it). Changing DNS needs administrator (Windows) or sudo (Linux). macOS is not supported yet."
          } > release-body.md

          cat release-body.md

      # Tag push (vX.Y.Z): versioned release; the table sits on top of the auto notes.
      - name: Release tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuickDNS ${{ github.ref_name }}
          body_path: release-body.md
          files: dist/*
          generate_release_notes: true
          make_latest: "true"
          fail_on_unmatched_files: true

      # Push to main: refresh the rolling "latest" release (stable asset names).
      # It must NOT be a prerelease: GitHub's latest-release definition — and therefore
      # the permanent /releases/latest/download/<asset> direct links used by the README
      # and website — only ever resolves against non-prerelease releases.
      - name: Refresh rolling latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "QuickDNS Latest Build (rolling)"
          body_path: release-body.md
          prerelease: false
          make_latest: "true"
          files: dist/*
          fail_on_unmatched_files: true

      # GitHub's "Latest" flag is what powers the permanent
      # /releases/latest/download/<asset> direct links (README + website). The
      # release action's make_latest input is not applied reliably on the update
      # path (release already exists), so PATCH it explicitly. Non-fatal: a
      # warning is emitted if GitHub rejects the flag.
      - name: Mark release as Latest (keeps direct links alive)
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            BODY='{"make_latest":"true"}'
          else
            TAG="latest"
            BODY='{"make_latest":"true","prerelease":false,"draft":false}'
          fi
          release_id=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" | jq -r '.id')
          if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$release_id" > /dev/null \
              || echo "::warning::Could not mark release $release_id as Latest."
            echo "Release $release_id (tag $TAG) processed."
          else
            echo "::warning::No release found for tag $TAG; nothing marked as Latest."
          fi
